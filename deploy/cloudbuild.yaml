# Cloud Build: build root Dockerfile and push SHA + latest tags
substitutions:
  _IMAGE_SHA: ""
  _IMAGE_LATEST: ""

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_IMAGE_SHA}
      - -t
      - ${_IMAGE_LATEST}
      - .

images:
  - ${_IMAGE_SHA}
  - ${_IMAGE_LATEST}

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
